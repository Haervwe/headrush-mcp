[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "headrush-mcp"
version = "0.1.0"
description = "MCP server for the HeadRush Flex Prime's local Remote Editor API."
readme = "README.md"
requires-python = ">=3.10"
license = "MIT"
authors = [{ name = "Haervwe" }]
keywords = ["mcp", "headrush", "guitar", "multi-fx"]
classifiers = [
    "Development Status :: 4 - Beta",
    "Programming Language :: Python :: 3",
    "Topic :: Multimedia :: Sound/Audio",
]
dependencies = ["httpx>=0.27", "mcp>=2,<3"]

[project.scripts]
headrush-mcp = "headrush_mcp.server:main"

[dependency-groups]
dev = ["pytest>=8.0"]

[tool.hatch.build.targets.wheel]
packages = ["src/headrush_mcp"]

[tool.pytest.ini_options]
testpaths = ["tests"]
